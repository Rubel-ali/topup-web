<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="pubg-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141108" />
      <stop offset="50%" stop-color="#0E131C" />
      <stop offset="100%" stop-color="#080C12" />
    </linearGradient>
    <radialGradient id="pubg-gold" cx="75%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#D97706" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="pubg-crate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <linearGradient id="pubg-uc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#pubg-bg)" />
  <circle cx="500" cy="130" r="230" fill="url(#pubg-gold)" />

  <!-- Tactical Hex Pattern Grid -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1.2">
    <path d="M 0,50 L 640,50 M 0,150 L 640,150 M 0,250 L 640,250" />
    <path d="M 120,0 L 120,360 M 280,0 L 280,360 M 440,0 L 440,360 M 600,0 L 600,360" />
  </g>

  <!-- Level 3 Spetsnaz Helmet Silhouette Vector -->
  <g transform="translate(360, 60)" opacity="0.85">
    <!-- Helmet Dome -->
    <path d="M80 40 C 130 10, 200 10, 240 50 C 270 85, 275 140, 260 190 L 230 200 L 220 230 L 110 230 L 95 190 L 70 170 C 55 120, 60 70, 80 40 Z" fill="#1E293B" stroke="#475569" stroke-width="3" />
    <!-- Visor Plate (Level 3 Dark Metallic Shield) -->
    <path d="M100 110 L 245 110 L 250 160 L 95 160 Z" fill="#0F172A" stroke="#F59E0B" stroke-width="2" />
    <!-- Visor Slit -->
    <rect x="115" y="128" width="115" height="14" rx="2" fill="#F59E0B" opacity="0.75" />
    <line x1="115" y1="135" x2="230" y2="135" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8" />
  </g>

  <!-- Glowing UC Gold Coins Stack -->
  <g transform="translate(240, 110)">
    <!-- Base Coin -->
    <ellipse cx="60" cy="90" rx="45" ry="22" fill="#B45309" stroke="#FBBF24" stroke-width="2" />
    <ellipse cx="60" cy="70" rx="45" ry="22" fill="#D97706" stroke="#FDE047" stroke-width="2" />
    <ellipse cx="60" cy="50" rx="45" ry="22" fill="url(#pubg-uc)" stroke="#FFFBEB" stroke-width="2" />
    <text x="60" y="56" fill="#78350F" font-family="system-ui, sans-serif" font-size="18" font-weight="900" text-anchor="middle">UC</text>
  </g>

  <!-- Red Air-Drop Smoke Signal Vector -->
  <g transform="translate(540, 70)" opacity="0.6">
    <path d="M0 160 C 15 120, -10 80, 15 40 C 25 10, -5 -20, 10 -60" stroke="#EF4444" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.4" />
    <path d="M10 160 C -5 120, 20 80, 5 40 C 30 10, 10 -20, 20 -60" stroke="#F87171" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7" />
  </g>

  <!-- Typography Brand Accent -->
  <g transform="translate(40, 110)">
    <rect x="0" y="0" width="130" height="22" rx="4" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-opacity="0.4" />
    <text x="65" y="15" fill="#FBBF24" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="1">KRAFTON / LEVEL INFINITE</text>
    
    <text x="0" y="65" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="0.5">PUBG MOBILE</text>
    <text x="0" y="95" fill="#F59E0B" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" letter-spacing="3">UNKNOWN CASH (UC)</text>
  </g>

  <!-- Vignette -->
  <rect y="220" width="640" height="140" fill="url(#pubg-bg)" opacity="0.85" />
</svg>

