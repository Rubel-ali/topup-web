<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="ff-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0B05" />
      <stop offset="40%" stop-color="#0E121B" />
      <stop offset="100%" stop-color="#070A10" />
    </linearGradient>
    <radialGradient id="ff-glow" cx="70%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FF5722" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#FF9800" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FF5722" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ff-flame" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#FF3D00" />
      <stop offset="60%" stop-color="#FF9100" />
      <stop offset="100%" stop-color="#FFD600" />
    </linearGradient>
    <linearGradient id="ff-diamond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#00B0FF" />
      <stop offset="100%" stop-color="#1DE9B6" />
    </linearGradient>
    <filter id="ff-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="640" height="360" fill="url(#ff-bg)" />
  <circle cx="480" cy="120" r="220" fill="url(#ff-glow)" />

  <!-- Cyber Grid Pattern -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="90" x2="640" y2="90" />
    <line x1="0" y1="180" x2="640" y2="180" />
    <line x1="0" y1="270" x2="640" y2="270" />
    <line x1="160" y1="0" x2="160" y2="360" />
    <line x1="320" y1="0" x2="320" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
  </g>

  <!-- Ember Flare Orbs -->
  <circle cx="500" cy="140" r="100" fill="#FF5722" opacity="0.25" filter="url(#ff-blur)" />
  <circle cx="200" cy="260" r="70" fill="#FF9800" opacity="0.15" filter="url(#ff-blur)" />

  <!-- Stylized Geometric Fiery Wing Silhouette -->
  <g transform="translate(360, 50)" opacity="0.9">
    <path d="M120 40 L190 110 L150 140 L210 180 L160 210 L190 250 L110 220 L70 260 L80 180 L20 190 L60 130 L10 120 L70 90 Z" fill="url(#ff-flame)" opacity="0.85" />
    <path d="M140 60 L180 110 L150 130 L190 170 L150 190 L170 220 L110 200 L80 230 L90 170 L40 180 L70 130 L30 120 L80 100 Z" fill="#FFF7C2" opacity="0.3" />
  </g>

  <!-- Big Diamond Gem Motif -->
  <g transform="translate(240, 90)">
    <polygon points="50,0 100,45 80,120 20,120 0,45" fill="url(#ff-diamond)" opacity="0.9" />
    <polygon points="50,0 100,45 50,120" fill="#00E5FF" opacity="0.6" />
    <polygon points="50,0 0,45 50,120" fill="#80D8FF" opacity="0.4" />
    <line x1="0" y1="45" x2="100" y2="45" stroke="#FFFFFF" stroke-width="2" opacity="0.8" />
    <line x1="50" y1="0" x2="50" y2="120" stroke="#FFFFFF" stroke-width="2" opacity="0.8" />
  </g>

  <!-- Cyber Target Reticle -->
  <g transform="translate(480, 160)" stroke="#FF9800" stroke-width="1.5" opacity="0.4" fill="none">
    <circle cx="0" cy="0" r="45" />
    <circle cx="0" cy="0" r="25" />
    <line x1="-55" y1="0" x2="55" y2="0" />
    <line x1="0" y1="-55" x2="0" y2="55" />
  </g>

  <!-- Typography Brand Accent -->
  <g transform="translate(40, 110)">
    <rect x="0" y="0" width="85" height="22" rx="4" fill="#FF5722" fill-opacity="0.2" stroke="#FF5722" stroke-opacity="0.4" />
    <text x="42" y="15" fill="#FF9800" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="1.5">GARENA</text>
    
    <text x="0" y="65" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="0.5">FREE FIRE</text>
    <text x="0" y="95" fill="#00E5FF" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" letter-spacing="3">DIAMOND RAIL</text>
  </g>

  <!-- Bottom Vignette Gradients for Card Text Legibility -->
  <rect y="220" width="640" height="140" fill="url(#ff-bg)" opacity="0.85" />
</svg>

