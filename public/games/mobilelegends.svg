<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="ml-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B091A" />
      <stop offset="50%" stop-color="#0E1322" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <radialGradient id="ml-nebula" cx="70%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ml-crest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#FCD34D" />
    </linearGradient>
    <linearGradient id="ml-gem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#ml-bg)" />
  <circle cx="480" cy="130" r="230" fill="url(#ml-nebula)" />

  <!-- Mystic Runes / Arcane Circle Grid -->
  <g transform="translate(460, 150)" stroke="#60A5FA" stroke-width="1.2" opacity="0.25" fill="none">
    <circle cx="0" cy="0" r="110" stroke-dasharray="8 6" />
    <circle cx="0" cy="0" r="85" />
    <circle cx="0" cy="0" r="55" stroke-dasharray="4 4" />
    <!-- 8-Pointed Star -->
    <polygon points="0,-85 20,-30 85,0 20,30 0,85 -20,30 -85,0 -20,-30" stroke="#A78BFA" stroke-width="1.5" />
  </g>

  <!-- Mythic Wings Crest -->
  <g transform="translate(350, 70)" opacity="0.85">
    <!-- Left Wing -->
    <path d="M70 120 C 30 90, 10 50, 0 10 C 20 40, 50 70, 70 80 C 40 40, 20 10, 30 -20 C 50 20, 80 50, 90 70 Z" fill="url(#ml-crest)" opacity="0.75" />
    <!-- Right Wing -->
    <path d="M110 120 C 150 90, 170 50, 180 10 C 160 40, 130 70, 110 80 C 140 40, 160 10, 150 -20 C 130 20, 100 50, 90 70 Z" fill="url(#ml-crest)" opacity="0.75" />
    <!-- Central Shield Crest -->
    <path d="M90 30 L 125 55 L 120 110 L 90 145 L 60 110 L 55 55 Z" fill="#1E1B4B" stroke="#60A5FA" stroke-width="3" />
    <polygon points="90,45 115,65 110,105 90,130 70,105 65,65" fill="url(#ml-gem)" />
    <!-- Gold Star Inset -->
    <polygon points="90,70 94,80 105,82 96,90 99,101 90,94 81,101 84,90 75,82 86,80" fill="#FDE047" stroke="#CA8A04" stroke-width="1" />
  </g>

  <!-- Diamond Cluster -->
  <g transform="translate(230, 110)">
    <polygon points="40,20 70,50 40,110 10,50" fill="#38BDF8" opacity="0.8" stroke="#93C5FD" stroke-width="2" />
    <polygon points="80,50 100,70 80,110 60,70" fill="#818CF8" opacity="0.7" stroke="#C7D2FE" stroke-width="1.5" />
  </g>

  <!-- Typography Brand Accent -->
  <g transform="translate(40, 110)">
    <rect x="0" y="0" width="85" height="22" rx="4" fill="#3B82F6" fill-opacity="0.2" stroke="#3B82F6" stroke-opacity="0.4" />
    <text x="42" y="15" fill="#60A5FA" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="1.5">MOONTON</text>
    
    <text x="0" y="65" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" letter-spacing="0.5">MOBILE LEGENDS</text>
    <text x="0" y="95" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" letter-spacing="2.5">BANG BANG • SERVER DIRECT</text>
  </g>

  <!-- Vignette -->
  <rect y="220" width="640" height="140" fill="url(#ml-bg)" opacity="0.85" />
</svg>

