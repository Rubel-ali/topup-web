<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="gp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081018" />
      <stop offset="50%" stop-color="#0D1520" />
      <stop offset="100%" stop-color="#05090F" />
    </linearGradient>
    <radialGradient id="gp-glow" cx="72%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#00E676" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#00B0FF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#00E676" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="gp-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0288D1" />
    </linearGradient>
    <linearGradient id="gp-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#00B0FF" />
    </linearGradient>
    <linearGradient id="gp-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1744" />
      <stop offset="100%" stop-color="#FF5252" />
    </linearGradient>
    <linearGradient id="gp-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD600" />
      <stop offset="100%" stop-color="#FF9100" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#gp-bg)" />
  <circle cx="480" cy="140" r="220" fill="url(#gp-glow)" />

  <!-- Holographic Card Foil Graphic -->
  <g transform="translate(340, 60)" opacity="0.9">
    <!-- Card Base Angle -->
    <rect x="0" y="0" width="220" height="140" rx="16" fill="#131D2A" stroke="#1E293B" stroke-width="2" transform="rotate(-6 110 70)" />
    <!-- Foil Sheen -->
    <path d="M-20 60 L 160 -40 L 180 -40 L 0 60 Z" fill="#FFFFFF" opacity="0.08" transform="rotate(-6 110 70)" />
    
    <!-- Iconic Google Play 4-Color Prism Triangle (Nested Center) -->
    <g transform="translate(70, 25)">
      <!-- Blue Quadrant -->
      <path d="M10 10 L 55 50 L 10 90 Z" fill="url(#gp-blue)" />
      <!-- Red Top Segment -->
      <path d="M10 10 L 75 30 L 55 50 Z" fill="url(#gp-red)" />
      <!-- Green Right Triangle -->
      <path d="M55 50 L 75 30 L 90 50 L 75 70 Z" fill="url(#gp-green)" />
      <!-- Yellow Bottom Segment -->
      <path d="M10 90 L 55 50 L 75 70 Z" fill="url(#gp-yellow)" />
    </g>
  </g>

  <!-- Floating Gift Ribbon Accent -->
  <g transform="translate(240, 90)">
    <circle cx="50" cy="50" r="38" fill="#00E676" opacity="0.1" />
    <circle cx="50" cy="50" r="28" fill="#00E676" opacity="0.2" />
    <text x="50" y="58" fill="#00E676" font-family="system-ui, sans-serif" font-size="24" font-weight="900" text-anchor="middle">$</text>
  </g>

  <!-- Typography Brand Accent -->
  <g transform="translate(40, 110)">
    <rect x="0" y="0" width="95" height="22" rx="4" fill="#00E676" fill-opacity="0.15" stroke="#00E676" stroke-opacity="0.4" />
    <text x="47" y="15" fill="#00E676" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="1.5">GOOGLE LLC</text>
    
    <text x="0" y="65" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" letter-spacing="0.5">GOOGLE PLAY</text>
    <text x="0" y="95" fill="#00E5FF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" letter-spacing="2.5">DIGITAL GIFT CARD (US / GLOBAL)</text>
  </g>

  <!-- Vignette -->
  <rect y="220" width="640" height="140" fill="url(#gp-bg)" opacity="0.85" />
</svg>

