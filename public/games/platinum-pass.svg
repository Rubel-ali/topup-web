<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="plat-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081422" />
      <stop offset="45%" stop-color="#0D192B" />
      <stop offset="100%" stop-color="#070A10" />
    </linearGradient>
    <radialGradient id="plat-glow" cx="70%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="plat-silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#CBD5E1" />
      <stop offset="70%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
    <linearGradient id="plat-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="plat-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#plat-bg)" />
  <circle cx="480" cy="120" r="220" fill="url(#plat-glow)" />

  <!-- High-Tech Hexagonal Cyber Grid -->
  <g opacity="0.08" stroke="#06B6D4" stroke-width="1.5">
    <line x1="0" y1="90" x2="640" y2="90" />
    <line x1="0" y1="180" x2="640" y2="180" />
    <line x1="0" y1="270" x2="640" y2="270" />
    <line x1="160" y1="0" x2="160" y2="360" stroke-dasharray="6 6" />
    <line x1="320" y1="0" x2="320" y2="360" stroke-dasharray="6 6" />
    <line x1="480" y1="0" x2="480" y2="360" stroke-dasharray="6 6" />
  </g>

  <!-- Platinum Geometric VIP Shield -->
  <g transform="translate(420, 50)">
    <polygon points="65,0 130,35 110,120 65,140 20,120 0,35" fill="#121824" stroke="url(#plat-silver)" stroke-width="3.5" />
    <polygon points="65,18 115,45 100,108 65,124 30,108 15,45" fill="none" stroke="url(#plat-cyan)" stroke-width="2" stroke-dasharray="8 6" />
    <!-- Center Platinum Star -->
    <polygon points="65,40 72,58 92,58 76,70 82,88 65,76 48,88 54,70 38,58 58,58" fill="url(#plat-silver)" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="65" cy="65" r="8" fill="#00E5FF" filter="url(#plat-blur)" opacity="0.8" />
  </g>

  <!-- Platinum High-Roller Cards Motif -->
  <g transform="translate(320, 95)" opacity="0.85">
    <rect x="0" y="10" width="70" height="95" rx="8" fill="#1E293B" stroke="url(#plat-silver)" stroke-width="2" transform="rotate(-12)" />
    <rect x="25" y="0" width="70" height="95" rx="8" fill="#0F172A" stroke="url(#plat-cyan)" stroke-width="2.5" />
    <text x="60" y="55" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="28" font-weight="900" text-anchor="middle">VIP</text>
  </g>

  <!-- Fine Vector Starbursts -->
  <g transform="translate(530, 70)" stroke="#06B6D4" stroke-width="1.2" opacity="0.4" fill="none">
    <circle cx="0" cy="0" r="35" stroke-dasharray="5 5" />
    <circle cx="0" cy="0" r="18" />
  </g>

  <!-- Typography Brand Accent -->
  <g transform="translate(40, 110)">
    <rect x="0" y="0" width="135" height="22" rx="4" fill="#06B6D4" fill-opacity="0.2" stroke="#06B6D4" stroke-opacity="0.4" />
    <text x="67" y="15" fill="#67E8F9" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="1.5">HIGH-ROLLER PASS</text>
    
    <text x="0" y="65" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="900" letter-spacing="0.5">PLATINUM PASS</text>
    <text x="0" y="95" fill="#06B6D4" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="800" letter-spacing="3">৳10,000 - ৳20,000 TIER</text>
  </g>

  <!-- Bottom Vignette -->
  <rect y="220" width="640" height="140" fill="url(#plat-bg)" opacity="0.85" />
</svg>
