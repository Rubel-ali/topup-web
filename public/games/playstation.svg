<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="ps-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08102A" />
      <stop offset="45%" stop-color="#0C1422" />
      <stop offset="100%" stop-color="#070A10" />
    </linearGradient>
    <radialGradient id="ps-glow" cx="70%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#00439C" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#0070D1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00439C" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ps-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0070D1" />
      <stop offset="100%" stop-color="#002F6C" />
    </linearGradient>
    <linearGradient id="ps-sym-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5A0" />
      <stop offset="100%" stop-color="#00D9F5" />
    </linearGradient>
    <linearGradient id="ps-sym-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C" />
      <stop offset="100%" stop-color="#E61E4D" />
    </linearGradient>
    <filter id="ps-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#ps-bg)" />
  <circle cx="480" cy="120" r="220" fill="url(#ps-glow)" />

  <!-- PlayStation Sacred Geometry Symbols -->
  <g transform="translate(420, 50)" opacity="0.9">
    <!-- Triangle (Green/Cyan) -->
    <polygon points="35,0 70,55 0,55" fill="none" stroke="#00F5A0" stroke-width="4.5" stroke-linejoin="round" />
    <!-- Circle (Red/Pink) -->
    <circle cx="120" cy="28" r="26" fill="none" stroke="#FF385C" stroke-width="4.5" />
    <!-- Cross (Blue) -->
    <g transform="translate(35, 100) rotate(45)">
      <line x1="-25" y1="0" x2="25" y2="0" stroke="#0070D1" stroke-width="5" stroke-linecap="round" />
      <line x1="0" y1="-25" x2="0" y2="25" stroke="#0070D1" stroke-width="5" stroke-linecap="round" />
    </g>
    <!-- Square (Pink/Purple) -->
    <rect x="95" y="75" width="48" height="48" rx="4" fill="none" stroke="#D946EF" stroke-width="4.5" />
  </g>

  <!-- PlayStation Classic Controller Grip Silhouette -->
  <g transform="translate(320, 110)" opacity="0.35" stroke="#0070D1" stroke-width="2" fill="none">
    <ellipse cx="40" cy="30" rx="35" ry="25" />
    <circle cx="30" cy="25" r="10" />
  </g>

  <!-- Cyber Grid Lines -->
  <g opacity="0.08" stroke="#0070D1" stroke-width="1.5">
    <line x1="0" y1="90" x2="640" y2="90" />
    <line x1="0" y1="180" x2="640" y2="180" />
    <line x1="0" y1="270" x2="640" y2="270" />
    <line x1="160" y1="0" x2="160" y2="360" />
    <line x1="320" y1="0" x2="320" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
  </g>

  <!-- Typography Brand Accent -->
  <g transform="translate(40, 110)">
    <rect x="0" y="0" width="130" height="22" rx="4" fill="#00439C" fill-opacity="0.3" stroke="#0070D1" stroke-opacity="0.5" />
    <text x="65" y="15" fill="#60A5FA" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="1.5">SONY INTERACTIVE</text>
    
    <text x="0" y="65" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" letter-spacing="0.5">PLAYSTATION</text>
    <text x="0" y="95" fill="#0070D1" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" letter-spacing="3">PSN NETWORK CARD</text>
  </g>

  <!-- Bottom Vignette -->
  <rect y="220" width="640" height="140" fill="url(#ps-bg)" opacity="0.85" />
</svg>
