<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="whole-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180C26" />
      <stop offset="45%" stop-color="#0E121B" />
      <stop offset="100%" stop-color="#070A10" />
    </linearGradient>
    <radialGradient id="whole-glow" cx="70%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="whole-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9D5FF" />
      <stop offset="40%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#7E22CE" />
    </linearGradient>
    <linearGradient id="whole-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <filter id="whole-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#whole-bg)" />
  <circle cx="480" cy="120" r="220" fill="url(#whole-glow)" />

  <!-- Laser Vault Security Array -->
  <g opacity="0.08" stroke="#A855F7" stroke-width="1.5">
    <line x1="0" y1="90" x2="640" y2="90" />
    <line x1="0" y1="180" x2="640" y2="180" />
    <line x1="0" y1="270" x2="640" y2="270" />
    <line x1="160" y1="0" x2="160" y2="360" stroke-dasharray="6 6" />
    <line x1="320" y1="0" x2="320" y2="360" stroke-dasharray="6 6" />
    <line x1="480" y1="0" x2="480" y2="360" stroke-dasharray="6 6" />
  </g>

  <!-- Giant Sovereign Wholesale Armored Chest -->
  <g transform="translate(410, 55)">
    <!-- Chest Base -->
    <path d="M10 50 L130 50 L115 125 L25 125 Z" fill="#121824" stroke="url(#whole-gold)" stroke-width="3.5" />
    <!-- Chest Lid -->
    <path d="M5 50 C5 25 35 15 70 15 C105 15 135 25 135 50 Z" fill="#1E1B4B" stroke="url(#whole-purple)" stroke-width="3.5" />
    <!-- Gold Trim Straps -->
    <line x1="40" y1="20" x2="50" y2="125" stroke="url(#whole-gold)" stroke-width="3" />
    <line x1="100" y1="20" x2="90" y2="125" stroke="url(#whole-gold)" stroke-width="3" />
    <!-- Center Sovereign Crest Lock -->
    <circle cx="70" cy="55" r="16" fill="url(#whole-gold)" />
    <polygon points="70,45 74,52 82,52 76,57 78,65 70,60 62,65 64,57 58,52 66,52" fill="#0B0E14" />
    <circle cx="70" cy="55" r="4" fill="#10B981" />
  </g>

  <!-- Imperial Wholesale Crown & Diamond -->
  <g transform="translate(320, 100)">
    <!-- Floating Emerald Diamond -->
    <polygon points="35,0 65,22 55,60 15,60 5,22" fill="#10B981" stroke="#6EE7B7" stroke-width="2" />
    <polygon points="35,0 65,22 35,60" fill="#047857" opacity="0.6" />
  </g>

  <!-- Fine Vector Radials -->
  <g transform="translate(530, 70)" stroke="#A855F7" stroke-width="1.2" opacity="0.4" fill="none">
    <circle cx="0" cy="0" r="35" stroke-dasharray="5 5" />
    <circle cx="0" cy="0" r="18" />
  </g>

  <!-- Typography Brand Accent -->
  <g transform="translate(40, 110)">
    <rect x="0" y="0" width="150" height="22" rx="4" fill="#A855F7" fill-opacity="0.2" stroke="#A855F7" stroke-opacity="0.4" />
    <text x="75" y="15" fill="#C084FC" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="1.5">ENTERPRISE WHOLESALE</text>
    
    <text x="0" y="65" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="900" letter-spacing="0.5">SOVEREIGN VAULT</text>
    <text x="0" y="95" fill="#A855F7" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="800" letter-spacing="3">৳15,000 - ৳25,000 BULK</text>
  </g>

  <!-- Bottom Vignette -->
  <rect y="220" width="640" height="140" fill="url(#whole-bg)" opacity="0.85" />
</svg>
