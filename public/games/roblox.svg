<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="rbx-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180A0C" />
      <stop offset="45%" stop-color="#0E121B" />
      <stop offset="100%" stop-color="#070A10" />
    </linearGradient>
    <radialGradient id="rbx-glow" cx="70%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#E11D48" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#F43F5E" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#E11D48" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="rbx-cube" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="50%" stop-color="#BE123C" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <linearGradient id="rbx-coin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="rbx-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#rbx-bg)" />
  <circle cx="480" cy="120" r="210" fill="url(#rbx-glow)" />

  <!-- Grid -->
  <g opacity="0.07" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="90" x2="640" y2="90" />
    <line x1="0" y1="180" x2="640" y2="180" />
    <line x1="0" y1="270" x2="640" y2="270" />
    <line x1="160" y1="0" x2="160" y2="360" />
    <line x1="320" y1="0" x2="320" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
  </g>

  <!-- Glow Flare -->
  <circle cx="480" cy="130" r="90" fill="#F43F5E" opacity="0.25" filter="url(#rbx-blur)" />

  <!-- Iconic Roblox Tilted Cube -->
  <g transform="translate(420, 60) rotate(-15)">
    <rect x="0" y="0" width="100" height="100" rx="16" fill="url(#rbx-cube)" stroke="#FDA4AF" stroke-width="3" />
    <rect x="32" y="32" width="36" height="36" rx="6" fill="#0E121B" />
  </g>

  <!-- Robux Hex Gold Coin -->
  <g transform="translate(320, 110)">
    <polygon points="40,0 80,23 80,69 40,92 0,69 0,23" fill="url(#rbx-coin)" stroke="#FDE68A" stroke-width="2.5" />
    <polygon points="40,15 67,31 67,61 40,77 13,61 13,31" fill="#B45309" opacity="0.5" />
    <rect x="30" y="36" width="20" height="20" rx="3" fill="#FDE68A" />
  </g>

  <!-- Target Marks -->
  <g transform="translate(530, 80)" stroke="#F43F5E" stroke-width="1.5" opacity="0.35" fill="none">
    <circle cx="0" cy="0" r="40" stroke-dasharray="6 6" />
    <circle cx="0" cy="0" r="20" />
  </g>

  <!-- Typography Brand Accent -->
  <g transform="translate(40, 110)">
    <rect x="0" y="0" width="100" height="22" rx="4" fill="#E11D48" fill-opacity="0.2" stroke="#E11D48" stroke-opacity="0.4" />
    <text x="50" y="15" fill="#FB7185" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="1.5">ROBLOX CORP</text>
    
    <text x="0" y="65" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="0.5">ROBLOX</text>
    <text x="0" y="95" fill="#F43F5E" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" letter-spacing="3">ROBUX STORE</text>
  </g>

  <!-- Bottom Vignette -->
  <rect y="220" width="640" height="140" fill="url(#rbx-bg)" opacity="0.85" />
</svg>
