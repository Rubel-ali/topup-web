<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="coc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14081E" />
      <stop offset="45%" stop-color="#0E121B" />
      <stop offset="100%" stop-color="#070A10" />
    </linearGradient>
    <radialGradient id="coc-glow" cx="70%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="coc-gem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="40%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="coc-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <filter id="coc-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#coc-bg)" />
  <circle cx="480" cy="120" r="210" fill="url(#coc-glow)" />

  <!-- Shield Arc Accents -->
  <g transform="translate(480, 130)" stroke="#10B981" stroke-width="1.5" opacity="0.25" fill="none">
    <circle cx="0" cy="0" r="85" />
    <circle cx="0" cy="0" r="55" stroke-dasharray="8 6" />
  </g>

  <!-- Giant Clash Emerald Gem -->
  <g transform="translate(420, 50)">
    <!-- Faceted Gem Shape -->
    <polygon points="50,0 100,35 80,105 20,105 0,35" fill="url(#coc-gem)" stroke="#6EE7B7" stroke-width="2.5" />
    <polygon points="50,0 100,35 50,105" fill="#059669" opacity="0.6" />
    <polygon points="50,0 0,35 50,105" fill="#A7F3D0" opacity="0.5" />
    <line x1="0" y1="35" x2="100" y2="35" stroke="#ECFDF5" stroke-width="2" opacity="0.8" />
    <line x1="50" y1="0" x2="50" y2="105" stroke="#ECFDF5" stroke-width="2" opacity="0.8" />
  </g>

  <!-- Clash Gold Shield & Sword Motif -->
  <g transform="translate(330, 90)">
    <polygon points="40,10 70,25 70,65 40,85 10,65 10,25" fill="url(#coc-gold)" stroke="#FDE68A" stroke-width="2" />
    <!-- Golden Star in Center -->
    <polygon points="40,30 43,39 52,39 45,45 48,54 40,49 32,54 35,45 28,39 37,39" fill="#FFFFFF" />
  </g>

  <!-- Barbarian King Crown Silhouette -->
  <g transform="translate(490, 110)" opacity="0.4">
    <polygon points="0,50 15,20 30,35 45,15 60,35 75,20 90,50" fill="url(#coc-gold)" />
  </g>

  <!-- Typography Brand Accent -->
  <g transform="translate(40, 110)">
    <rect x="0" y="0" width="85" height="22" rx="4" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-opacity="0.4" />
    <text x="42" y="15" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="1.5">SUPERCELL</text>
    
    <text x="0" y="65" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" letter-spacing="0.5">CLASH OF CLANS</text>
    <text x="0" y="95" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" letter-spacing="3">GEMS &amp; GOLD PASS</text>
  </g>

  <!-- Bottom Vignette -->
  <rect y="220" width="640" height="140" fill="url(#coc-bg)" opacity="0.85" />
</svg>
