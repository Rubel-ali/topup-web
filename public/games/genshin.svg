<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="gi-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E24" />
      <stop offset="45%" stop-color="#0D1322" />
      <stop offset="100%" stop-color="#070A10" />
    </linearGradient>
    <radialGradient id="gi-glow" cx="70%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="gi-primo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="40%" stop-color="#818CF8" />
      <stop offset="70%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>
    <linearGradient id="gi-crystal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="gi-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#gi-bg)" />
  <circle cx="480" cy="120" r="210" fill="url(#gi-glow)" />

  <!-- Celestial Orbit Rings -->
  <g transform="translate(480, 130)" stroke="#38BDF8" stroke-width="1.2" opacity="0.3" fill="none">
    <ellipse cx="0" cy="0" rx="90" ry="35" transform="rotate(-25)" />
    <ellipse cx="0" cy="0" rx="90" ry="35" transform="rotate(35)" />
    <circle cx="0" cy="0" r="60" stroke-dasharray="6 6" />
  </g>

  <!-- Giant Iconic Primogem 4-Pointed Star -->
  <g transform="translate(430, 60)">
    <!-- Star Points -->
    <path d="M50 0 C45 35 35 45 0 50 C35 55 45 65 50 100 C55 65 65 55 100 50 C65 45 55 35 50 0 Z" fill="url(#gi-primo)" stroke="#E0E7FF" stroke-width="2.5" />
    <!-- Inner Radiant Core -->
    <circle cx="50" cy="50" r="14" fill="#FFFFFF" opacity="0.9" filter="url(#gi-blur)" />
    <circle cx="50" cy="50" r="6" fill="#FFFFFF" />
  </g>

  <!-- Genesis Crystal Motif -->
  <g transform="translate(320, 100)">
    <polygon points="30,0 55,20 45,70 15,70 5,20" fill="url(#gi-crystal)" stroke="#BAE6FD" stroke-width="2" />
    <polygon points="30,0 55,20 30,70" fill="#0284C7" opacity="0.6" />
  </g>

  <!-- Constellation Sparkles -->
  <g transform="translate(530, 50)" fill="#BAE6FD" opacity="0.7">
    <circle cx="10" cy="10" r="2" />
    <circle cx="30" cy="40" r="3" />
    <circle cx="5" cy="70" r="2.5" />
  </g>

  <!-- Typography Brand Accent -->
  <g transform="translate(40, 110)">
    <rect x="0" y="0" width="105" height="22" rx="4" fill="#06B6D4" fill-opacity="0.2" stroke="#06B6D4" stroke-opacity="0.4" />
    <text x="52" y="15" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="1.5">COGNOSPHERE</text>
    
    <text x="0" y="65" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" letter-spacing="0.5">GENSHIN IMPACT</text>
    <text x="0" y="95" fill="#06B6D4" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" letter-spacing="3">GENESIS CRYSTALS</text>
  </g>

  <!-- Bottom Vignette -->
  <rect y="220" width="640" height="140" fill="url(#gi-bg)" opacity="0.85" />
</svg>
