<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="steam-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101822" />
      <stop offset="45%" stop-color="#172533" />
      <stop offset="100%" stop-color="#090E14" />
    </linearGradient>
    <radialGradient id="steam-glow" cx="70%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#66C0F4" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#1B2838" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#101822" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="steam-arm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C7D5E0" />
      <stop offset="100%" stop-color="#66C0F4" />
    </linearGradient>
    <linearGradient id="steam-piston" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B2838" />
      <stop offset="100%" stop-color="#171A21" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#steam-bg)" />
  <circle cx="480" cy="140" r="230" fill="url(#steam-glow)" />

  <!-- Industrial Mesh / Blueprint Grid Lines -->
  <g opacity="0.08" stroke="#66C0F4" stroke-width="1.2">
    <line x1="0" y1="80" x2="640" y2="80" />
    <line x1="0" y1="160" x2="640" y2="160" />
    <line x1="0" y1="240" x2="640" y2="240" />
    <line x1="160" y1="0" x2="160" y2="360" />
    <line x1="320" y1="0" x2="320" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
  </g>

  <!-- Steam Iconic Crank / Piston Mechanism Emblem -->
  <g transform="translate(360, 60)" opacity="0.88">
    <!-- Big Outer Crank Pivot Circle -->
    <circle cx="160" cy="110" r="80" fill="url(#steam-piston)" stroke="#66C0F4" stroke-width="6" />
    <circle cx="160" cy="110" r="45" fill="#1B2838" stroke="#C7D5E0" stroke-width="4" />
    
    <!-- Crank Arm Connecting Rod -->
    <path d="M 160,110 L 60,190 L 40,165 L 140,85 Z" fill="url(#steam-arm)" opacity="0.9" />
    
    <!-- Small Pivot Ring 1 -->
    <circle cx="50" cy="177" r="30" fill="url(#steam-piston)" stroke="#66C0F4" stroke-width="5" />
    <circle cx="50" cy="177" r="14" fill="#66C0F4" />

    <!-- Connecting Rod 2 to Piston -->
    <path d="M 160,110 L 190,40 L 220,55 L 190,125 Z" fill="url(#steam-arm)" opacity="0.6" />
    <!-- Secondary Joint -->
    <circle cx="205" cy="47" r="22" fill="url(#steam-piston)" stroke="#C7D5E0" stroke-width="3" />
    <circle cx="205" cy="47" r="10" fill="#66C0F4" />
  </g>

  <!-- Typography Brand Accent -->
  <g transform="translate(40, 110)">
    <rect x="0" y="0" width="135" height="22" rx="4" fill="#66C0F4" fill-opacity="0.15" stroke="#66C0F4" stroke-opacity="0.4" />
    <text x="67" y="15" fill="#66C0F4" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="1.5">VALVE CORPORATION</text>
    
    <text x="0" y="65" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="0.5">STEAM WALLET</text>
    <text x="0" y="95" fill="#66C0F4" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" letter-spacing="2.5">GLOBAL E-CODE • INSTANT REDEEM</text>
  </g>

  <!-- Vignette -->
  <rect y="220" width="640" height="140" fill="url(#steam-bg)" opacity="0.85" />
</svg>

