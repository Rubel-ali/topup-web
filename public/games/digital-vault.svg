<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="vault-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1405" />
      <stop offset="45%" stop-color="#0E121B" />
      <stop offset="100%" stop-color="#070A10" />
    </linearGradient>
    <radialGradient id="vault-glow" cx="70%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="vault-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="vault-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="vault-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#vault-bg)" />
  <circle cx="480" cy="120" r="220" fill="url(#vault-glow)" />

  <!-- Cyber Hex Security Grid -->
  <g opacity="0.08" stroke="#F59E0B" stroke-width="1.5">
    <line x1="0" y1="90" x2="640" y2="90" />
    <line x1="0" y1="180" x2="640" y2="180" />
    <line x1="0" y1="270" x2="640" y2="270" />
    <line x1="160" y1="0" x2="160" y2="360" stroke-dasharray="6 6" />
    <line x1="320" y1="0" x2="320" y2="360" stroke-dasharray="6 6" />
    <line x1="480" y1="0" x2="480" y2="360" stroke-dasharray="6 6" />
  </g>

  <!-- Giant VIP Gold Vault Safe Door -->
  <g transform="translate(420, 50)">
    <!-- Outer Safe Ring -->
    <circle cx="65" cy="65" r="60" fill="#121824" stroke="url(#vault-gold)" stroke-width="4" />
    <circle cx="65" cy="65" r="48" fill="none" stroke="#FDE68A" stroke-width="2" stroke-dasharray="10 8" />
    <circle cx="65" cy="65" r="32" fill="#0B0E14" stroke="url(#vault-emerald)" stroke-width="2.5" />
    <!-- Vault Wheel Spokes -->
    <line x1="65" y1="20" x2="65" y2="110" stroke="url(#vault-gold)" stroke-width="4" stroke-linecap="round" />
    <line x1="20" y1="65" x2="110" y2="65" stroke="url(#vault-gold)" stroke-width="4" stroke-linecap="round" />
    <circle cx="65" cy="65" r="14" fill="url(#vault-gold)" />
    <!-- Center Bolt -->
    <circle cx="65" cy="65" r="6" fill="#1E293B" />
  </g>

  <!-- VIP Crown Glyph -->
  <g transform="translate(320, 100)">
    <polygon points="0,50 15,15 35,35 55,10 75,35 95,15 110,50" fill="url(#vault-gold)" stroke="#FEF08A" stroke-width="2" />
    <rect x="0" y="52" width="110" height="12" rx="3" fill="#B45309" stroke="#FEF08A" stroke-width="1.5" />
    <!-- Crown Jewels -->
    <circle cx="15" cy="15" r="4" fill="#10B981" />
    <circle cx="55" cy="10" r="5" fill="#38BDF8" />
    <circle cx="95" cy="15" r="4" fill="#10B981" />
    <circle cx="55" cy="58" r="3" fill="#FEF08A" />
  </g>

  <!-- Typography Brand Accent -->
  <g transform="translate(40, 110)">
    <rect x="0" y="0" width="125" height="22" rx="4" fill="#F59E0B" fill-opacity="0.2" stroke="#F59E0B" stroke-opacity="0.4" />
    <text x="62" y="15" fill="#FCD34D" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="1.5">ENTERPRISE VAULT</text>
    
    <text x="0" y="65" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="900" letter-spacing="0.5">VIP DIGITAL VAULT</text>
    <text x="0" y="95" fill="#F59E0B" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="800" letter-spacing="3">৳5,000 - ৳20,000 BUNDLE</text>
  </g>

  <!-- Bottom Vignette -->
  <rect y="220" width="640" height="140" fill="url(#vault-bg)" opacity="0.85" />
</svg>
